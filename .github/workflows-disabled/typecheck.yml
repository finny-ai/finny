name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

  cli-publish-build:
    name: cli publish build smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x64
            runner: ubuntu-latest
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      MODELS_DEV_API_JSON: ${{ github.workspace }}/packages/opencode/test/tool/fixtures/models-api.json
      OPENCODE_VERSION: 0.0.0-pr-${{ github.run_id }}
      OPENCODE_CHANNEL: pr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install cross-platform native deps
        run: bun install --os="*" --cpu="*"

      - name: Build CLI package
        run: ./packages/opencode/script/build.ts --single --skip-install --skip-embed-web-ui
