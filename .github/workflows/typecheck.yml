name: cli-smoke

on:
  push:
    branches: [staging-dev]
    paths:
      - ".github/workflows/typecheck.yml"
      - "bun.lock"
      - "package.json"
      - "packages/opencode/**"
  pull_request:
    branches: [staging-dev]
    paths:
      - ".github/workflows/typecheck.yml"
      - "bun.lock"
      - "package.json"
      - "packages/opencode/**"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

  pr-cli-build:
    name: pr cli build smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      MODELS_DEV_API_JSON: ${{ github.workspace }}/packages/opencode/test/tool/fixtures/models-api.json
      OPENCODE_VERSION: 0.0.0-pr-${{ github.run_id }}
      OPENCODE_CHANNEL: pr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install cross-platform native deps
        run: bun install --os="*" --cpu="*"

      - name: Build CLI package
        run: ./packages/opencode/script/build.ts --single --skip-install --skip-embed-web-ui

  staging-platform-build:
    name: staging platform build smoke (${{ matrix.platform }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      MODELS_DEV_API_JSON: ${{ github.workspace }}/packages/opencode/test/tool/fixtures/models-api.json
      OPENCODE_VERSION: 0.0.0-pr-${{ github.run_id }}
      OPENCODE_CHANNEL: pr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install cross-platform native deps
        run: bun install --os="*" --cpu="*"

      - name: Build CLI package
        run: ./packages/opencode/script/build.ts --single --skip-install --skip-embed-web-ui
