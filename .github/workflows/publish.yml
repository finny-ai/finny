name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string
      bump:
        description: 'Version bump type (if version not specified)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev.$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Build all platforms
        working-directory: packages/finny
        env:
          FINNY_VERSION: ${{ steps.version.outputs.version }}
          FINNY_CHANNEL: latest
        run: bun run build

      - name: Prepare npm packages
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Update main package version
          cd packages/finny/npm
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"$VERSION\"/g" package.json
          sed -i "s/\"finny-darwin-arm64\": \"0.0.0\"/\"finny-darwin-arm64\": \"$VERSION\"/g" package.json
          sed -i "s/\"finny-darwin-x64\": \"0.0.0\"/\"finny-darwin-x64\": \"$VERSION\"/g" package.json
          sed -i "s/\"finny-linux-arm64\": \"0.0.0\"/\"finny-linux-arm64\": \"$VERSION\"/g" package.json
          sed -i "s/\"finny-linux-x64\": \"0.0.0\"/\"finny-linux-x64\": \"$VERSION\"/g" package.json
          sed -i "s/\"finny-windows-x64\": \"0.0.0\"/\"finny-windows-x64\": \"$VERSION\"/g" package.json
          cd ../../..

          # Update platform package versions
          for pkg in packages/finny/dist/finny-*/package.json; do
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/g" "$pkg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            packages/finny/dist/
            packages/finny/npm/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in dist/finny-*/; do
            echo "Publishing $pkg..."
            cd "$pkg"
            npm publish --access public || true
            cd ../..
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          npm publish --access public
