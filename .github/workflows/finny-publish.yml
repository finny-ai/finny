name: finny-publish
run-name: "publish finny ${{ inputs.version || 'snapshot' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.27). Leave empty for snapshot build."
        required: false
        type: string

concurrency:
  group: finny-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Set version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            TIMESTAMP=$(date -u +%Y%m%d%H%M)
            echo "version=0.0.0-dev-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI (all platforms)
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ steps.version.outputs.channel }}

      - uses: actions/upload-artifact@v4
        with:
          name: finny-cli
          path: packages/opencode/dist

    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: finny-cli
          path: packages/opencode/dist

      - name: Publish to npm
        working-directory: packages/opencode
        run: |
          # Publish each platform package
          for dir in dist/finny-*/; do
            if [ -d "$dir" ]; then
              echo "Publishing $dir..."
              chmod -R 755 "$dir"
              cd "$dir"
              bun pm pack
              npm publish *.tgz --access public --tag ${{ needs.build.outputs.channel }}
              cd -
            fi
          done

          # Build and publish the main finny-ai package
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION="${{ needs.build.outputs.version }}"
          mkdir -p "dist/${PKG_NAME}"
          cp -r ./bin "dist/${PKG_NAME}/bin"
          cp ./script/postinstall.mjs "dist/${PKG_NAME}/postinstall.mjs"

          # Collect optionalDependencies from platform packages
          DEPS=$(node -e "
            const fs = require('fs');
            const deps = {};
            for (const dir of fs.readdirSync('./dist')) {
              const pkg = './dist/' + dir + '/package.json';
              if (dir.startsWith('finny-') && fs.existsSync(pkg)) {
                const p = JSON.parse(fs.readFileSync(pkg, 'utf8'));
                deps[p.name] = p.version;
              }
            }
            console.log(JSON.stringify(deps));
          ")

          node -e "
            const pkg = require('./package.json');
            const deps = JSON.parse('${DEPS}');
            const out = {
              name: pkg.name,
              bin: { [pkg.name]: './bin/' + pkg.name },
              scripts: { postinstall: 'bun ./postinstall.mjs || node ./postinstall.mjs' },
              version: '${VERSION}',
              license: pkg.license,
              optionalDependencies: deps,
            };
            require('fs').writeFileSync('./dist/${PKG_NAME}/package.json', JSON.stringify(out, null, 2));
          "

          cd "dist/${PKG_NAME}"
          bun pm pack
          npm publish *.tgz --access public --tag ${{ needs.build.outputs.channel }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
