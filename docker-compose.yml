version: '3.8'

services:
  algoclash:
    build: .
    container_name: algoclash-simulator
    ports:
      - "8000:8000"
    volumes:
      # Persist database and strategies across container restarts
      - algoclash-data:/app/simulator
      - algoclash-strategies:/app/strategies
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - FINANCIAL_DATASETS_API_KEY=${FINANCIAL_DATASETS_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: nginx reverse proxy for SSL
  nginx:
    image: nginx:alpine
    container_name: algoclash-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - algoclash
    restart: unless-stopped
    profiles:
      - production

  # Optional: Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: algoclash-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - production

volumes:
  algoclash-data:
  algoclash-strategies:
