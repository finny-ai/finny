[project]
name = "finny-engine-runtime"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<23",
  "pydantic>=2.10,<3",
  "pytz>=2025.2",
  "requests>=2.32,<3",
  "scipy>=1.15,<2",
  "yfinance>=0.2.65,<1",
]

[dependency-groups]
dev = [
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "pytest>=8.4,<9",
]

[tool.uv]
package = false
